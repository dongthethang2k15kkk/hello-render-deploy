# Persistent PostgreSQL for Docker on a local machine or VPS.
# Do not use this as an in-container database on Render Free: that filesystem is ephemeral.
services:
  app:
    environment:
      DATABASE_URL: postgresql://shop:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/game_shop?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: game_shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d game_shop"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://shop:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/game_shop?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
volumes:
  postgres_data:
