# Render Free runs only the app container. DATABASE_URL must point to a
# persistent external PostgreSQL provider; do not run PostgreSQL in this service.
services:
  - type: web
    name: shop-concept-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      # Set these in the Render dashboard (sync: false keeps them out of Git).
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_GOOGLE_EMAILS
        sync: false
      - key: APP_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
