name: Docker checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - name: Build and start with PostgreSQL migrations
        env:
          AUTH_SECRET: ci-only-secret-at-least-32-characters-long
          POSTGRES_PASSWORD: ci_only_database_password
        run: docker compose -f compose.yaml -f compose.db.yaml up --build -d
      - name: Check HTTP and database-backed Admin
        run: node scripts/smoke-container.mjs
      - name: Logs and cleanup
        if: always()
        env:
          AUTH_SECRET: ci-only-secret-at-least-32-characters-long
          POSTGRES_PASSWORD: ci_only_database_password
        run: |
          docker compose -f compose.yaml -f compose.db.yaml logs --tail=100
          docker compose -f compose.yaml -f compose.db.yaml down
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only_e2e_password
          POSTGRES_DB: e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:ci_only_e2e_password@localhost:5432/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
