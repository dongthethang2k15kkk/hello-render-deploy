name: Shop housekeeping

# Render Free has no cron jobs, so GitHub calls the shop's tick endpoint. It sends appointment reminders,
# checks Litecoin payments and expires unpaid orders. 01:00-16:59 UTC = 08:00-23:59 Vietnam time.
on:
  schedule:
    - cron: '*/15 1-16 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the tick endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 https://jewish-horse.onrender.com/api/cron/tick
